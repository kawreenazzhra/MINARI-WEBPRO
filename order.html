<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINARI - Yellow Shirt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
/* ===== Base & Navbar offset ===== */
    /* ubah jika tinggi navbar-mu beda */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  background-color: white;    /* cegah konten ketiban navbar */
}

/* ===== Main content ===== */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #fff;
  padding: 24px;
  min-height: calc(100vh - 90px);
}

.product {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 72px;                          /* sebelumnya 200px: terlalu lebar */
  max-width: 1100px;
  width: 100%;
}

.product img {
  width: 380px;
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  display: block;
}

/* ===== Details ===== */
.details {
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 520px;
  width: 100%;
}

.details h2 {
  font-size: 40px;
  font-weight: 700;
  line-height: 1.2;
}

.details p {
  font-size: 24px;
}

/* ===== Quantity ===== */
.quantity {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #000;
  border-radius: 15px;
  width: 200px;
  height: 64px;
  font-size: 20px;
}

.quantity button {
  width: 56px;
  height: 100%;
  border: none;
  background-color: #fff;
  font-size: 28px;
  cursor: pointer;
  transition: background .15s ease;
}

.quantity button:hover { background-color: #f2f2f2; }

.quantity span {
  width: 72px;
  text-align: center;
  font-weight: 600;
}

/* ===== Add to cart button ===== */
.add-to-cart {
  width: 280px;
  height: 64px;                       /* konsisten dengan qty */
  background-color: #fceee8;
  border: 1px solid #000;
  border-radius: 15px;
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.add-to-cart:hover {
  background-color: #f9e4db;
  transform: translateY(-1px);
}

/* ===== Responsive ===== */
@media (max-width: 992px) {
  :root { --nav-height: 80px; }       /* navbar biasanya lebih kecil di tablet */
  .product { gap: 40px; }
  .details h2 { font-size: 32px; }
  .details p { font-size: 20px; }
}

@media (max-width: 600px) {
  :root { --nav-height: 70px; }
  .container { padding: 56px 16px; }
  .product { flex-direction: column; gap: 28px; text-align: center; }
  .product img { width: 78vw; max-width: 360px; }
  .details { align-items: center; }
  .details h2 { font-size: 28px; }
  .details p { font-size: 18px; }
  .quantity { width: 200px; height: 56px; }
  .add-to-cart { width: 240px; height: 56px; font-size: 18px; }
}

/* ---- Mini toast ---- */
.mini-toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  min-width: 260px;
  max-width: 80vw;
  background: #111;
  color: #fff;
  padding: 12px 14px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
  font-size: 14px;
  line-height: 1.35;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .25s ease, transform .25s ease;
  z-index: 4000;
  pointer-events: none;
}
.mini-toast.show {
  opacity: 1;
  transform: translateY(0);
}
.mini-toast small { opacity: .8; display:block; margin-top:4px; }

  </style>
    <link rel="stylesheet" href="navbar.css">
</head>
<body>

 <header id="navMount"></header>
  <main class="container">
    <div class="product">
      <img src="WhatsApp Image 2025-11-10 at 10.41.14_0a45d35c.jpg" alt="Yellow Shirt">
      <div class="details">
        <h2>Yellow shirt</h2>
        <p>Rp. 175.000,00</p>

        <div class="quantity">
          <button id="minus">-</button>
          <span id="count">0</span>
          <button id="plus">+</button>
        </div>

        <button class="add-to-cart">Add to chart</button>
      </div>
    </div>
  </main>


  <script>
    // Quantity counter
    const minus = document.getElementById('minus');
    const plus = document.getElementById('plus');
    const count = document.getElementById('count');
    let quantity = 0;

    minus.addEventListener('click', () => {
      if (quantity > 0) {
        quantity--;
        count.textContent = quantity;
      }
    });

    plus.addEventListener('click', () => {
      quantity++;
      count.textContent = quantity;
    });
  // --- helper toast ---
  function showToast(message, subtext = '') {
    let box = document.getElementById('miniToast');
    if (!box) {
      box = document.createElement('div');
      box.id = 'miniToast';
      box.className = 'mini-toast';
      box.innerHTML = '<span id="mtMsg"></span><small id="mtSub"></small>';
      document.body.appendChild(box);
    }
    box.querySelector('#mtMsg').textContent = message;
    box.querySelector('#mtSub').textContent = subtext || '';
    box.classList.add('show');
    clearTimeout(box._hideT);
    box._hideT = setTimeout(()=> box.classList.remove('show'), 1800);
  }

  // --- Add to cart click ---
  const addBtn = document.querySelector('.add-to-cart');
  addBtn.addEventListener('click', () => {
    const name  = document.querySelector('.details h2')?.textContent?.trim() || 'Item';
    // optional: simpan ke cart (localStorage)
    const price = Number(String(document.querySelector('.details p')?.textContent || '').replace(/[^\d]/g,'')) || 0;
    const image = document.querySelector('.product img')?.getAttribute('src') || '';
    const cart  = JSON.parse(localStorage.getItem('cartItems') || '[]');
    cart.push({ id: Date.now().toString(), name, price, image, quantity: Math.max(1, quantity) });
    localStorage.setItem('cartItems', JSON.stringify(cart));

    // tampilkan notifikasi (English)
    showToast(`“${name}” has been added to your cart.`, `Quantity: ${Math.max(1, quantity)}`);
  });

  // start at least 1 item (optional)
  quantity = Math.max(1, quantity);
  document.getElementById('count').textContent = quantity;
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
