<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MINARI - Add Category</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="style1.css">
    </head>
    <body>
        <nav class="navbar-custom fixed-top">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center w-100 px-5">
                    <div class="logo">
                        <img src="minarilogo.png" alt="Logo MINARI" style="height: 40px; width: auto;">
                    </div>
                    <div class="navbar-icons">
                        <i class="fas fa-search" title="Search"></i>
                        <i class="fas fa-envelope" title="Messages"></i>
                    </div>
                </div>
            </div>
        </nav>

        <div class="sidebar">
            <a href="dashboardadmin.html" class="sidebar-item">
                <i class="fas fa-table-columns"></i>
                <span>Dashboard</span>
            </a>
            <a href="productadmin.html" class="sidebar-item">
                <i class="fas fa-box"></i>
                <span>Product</span>
            </a>
            <a href="categoriesadmin.html" class="sidebar-item active">
                <i class="fas fa-layer-group"></i>
                <span>Categories</span>
            </a>
            <a href="ordersadmin.html" class="sidebar-item">
                <i class="fas fa-file-invoice"></i>
                <span>Orders</span>
            </a>
            <a href="customersadmin.html" class="sidebar-item">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="reviewadmin.html" class="sidebar-item">
                <i class="fas fa-thumbs-up"></i>
                <span>Review</span>
            </a>
            <a href="promotionsadmin.html" class="sidebar-item">
                <i class="fas fa-ad"></i>
                <span>Promotions</span>
            </a>
        </div>

        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title">Add New Category</h2>
                <a href="categoriesadmin.html" class="btn-cancel">
                    <i class="fas fa-arrow-left"></i> Back to Categories
                </a>
            </div>

            <div class="form-container">
                <form id="addCategoryForm">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="categoryName" class="form-label">Category Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="categoryName" placeholder="Enter category name" required>
                                <div class="validation-message error" id="nameError"></div>
                            </div>
                            
                            <div class="form-group">
                                <label for="categoryDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="categoryDescription" rows="4" placeholder="Enter category description"></textarea>
                                <div class="validation-message" id="descriptionError"></div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status" id="activeStatus" value="active" checked>
                                    <label class="form-check-label" for="activeStatus">
                                        Active
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status" id="inactiveStatus" value="inactive">
                                    <label class="form-check-label" for="inactiveStatus">
                                        Inactive
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label">Category Image <span class="text-danger">*</span></label>
                                
                                <div class="image-upload" onclick="document.getElementById('categoryImage').click()">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <p>Click to upload category image</p>
                                    <small>JPG, PNG, or GIF (Max 2MB)</small>
                                    <input type="file" id="categoryImage" class="file-input" accept="image/*" required>
                                </div>
                                
                                <img id="imagePreview" class="image-preview" src="#" alt="Preview">
                                <div class="validation-message error" id="imageError"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end mt-4">
                        <button type="button" class="btn-cancel me-2" onclick="categoryManager.cancelForm()">Cancel</button>
                        <button type="submit" class="btn-add">
                            <i class="fas fa-plus"></i> Add Category
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <footer>
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="logo">
                            <img src="minarilogo.png" alt="Logo MINARI" style="height: 40px; width: auto;">
                        </div>
                        <p>Your everyday fashion boutique</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <p>Give us suggestions for future progress</p>
                        <div class="footer-form">
                            <input type="text" placeholder="your message . . .">
                            <button>Send</button>
                        </div>
                    </div>
                </div>
                <div class="footer-divider"></div>
                <div class="copyright">
                    © 2025 MINARI. All Rights Reserved.
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="navigation.js"></script>
        <script src="addcategoriadmin.js"></script>
    </body>
</html>
