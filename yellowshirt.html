<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINARI | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="shirtblouse.css">
      <link rel="stylesheet" href="navbar.css">
</head>
<body >
   <header id="navMount"></header>


    <!-- Account mini dropdown -->
<div id="accMini" class="accmini" aria-hidden="true" role="dialog">
  <div class="accmini__row">
    <i class="fa-regular fa-user accmini__icon"></i>
    <!-- ubah span jadi <a> -->
    <a id="accMiniName" href="akungues.html" class="accmini__name">Guest</a>
  </div>

    <a id="accMiniBtn" class="accmini__btn" href="login.html">Log in</a>
</div>

  <!-- Detail Section -->
  <main class="container my-4">
    <section class="pd">
      <div class="row g-4 align-items-center">
        <!-- Gambar -->
        <div class="col-lg-6">
          <div class="pd-media">
            <img id="pdImg" src="" alt="" />
          </div>
        </div>

        <!-- Info -->
        <div class="col-lg-6">
          <div class="pd-info">
            <h1 id="pdTitle" class="pd-title">Yellow shirt</h1>
            <div id="pdPrice" class="pd-price">Rp. 175.000,00</div>

            <div class="pd-qty mt-3">
              <button id="btnMinus" class="qty-btn" aria-label="Decrease">−</button>
              <input id="qtyInput" class="qty-input" type="number" value="0" min="0" readonly>
              <button id="btnPlus" class="qty-btn" aria-label="Increase">+</button>
            </div>

            <button id="addBtn" class="btn add-btn mt-3">Add to cart</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="miniToast" class="toast align-items-center" data-bs-delay="1600">
      <div class="d-flex">
        <div class="toast-body">Item has been added to your cart.</div>
        <button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="detail.js"></script>
      <script src="navbar.js"></script>
</body>
</html>
