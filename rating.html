<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Rating - MINARI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff;
      color: #333;
      overflow-x: hidden;
    }



    /* ===== MAIN CONTENT ===== */
    main {
      width: 100%;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
    }

    .page-title {
      width: 100%;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .product-box {
      border: 1px solid #999;
      text-align: center;
      width: 260px;
      padding: 10px;
      border-radius: 10px;
      background-color: #fff;
      flex-shrink: 0;
    }

    .product-box img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .product-box .product-name {
      font-weight: 500;
      margin-top: 10px;
    }

    .product-box .product-price {
      color: #555;
    }

    /* ===== RATING SECTION ===== */
    .rating-section {
      flex: 1;
      min-width: 300px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .rating-label {
      font-weight: 500;
      font-size: 18px;
    }

    .stars {
      display: flex;
      gap: 5px;
      margin: 10px 0 25px;
    }

    .star {
      font-size: 30px;
      color: #e5a391;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .star:hover {
      transform: scale(1.2);
    }

    textarea {
      width: 100%;
      height: 120px;
      font-family: 'Poppins', sans-serif;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 14px;
    }

    .checkbox {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn-submit {
      background-color: #d6a48b;
      border: none;
      color: white;
      font-size: 16px;
      padding: 10px 35px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #c38b74;
    }

    /* ===== FOOTER ===== */
    /* Footer */
footer {
    background: #D9AF9C;
    margin-top: 10px;
    padding: 15px 0;
}

footer .container {
    padding: 0 15px;
}

footer .logo {
    font-size: 20px;
    color: #FFF3CC;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 0;
}

footer .logo-img {
    height: 35px;
    width: auto;
    filter: brightness(0) invert(1);
}

footer p {
    color: #FFF3CC;
    margin-top: 5px;
    font-size: 12px;
}

/* Footer Form Right Alignment */
footer .text-end.input-end {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

footer .text-end.input-end p {
    text-align: right;
    margin-bottom: 10px;
    width: 100%;
}

footer .text-end .footer-form {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    align-items: center;
    width: 100%;
}

footer .text-end .footer-form input {
    background: #FFFFFF;
    border: 2px solid #FFF3CC;
    border-radius: 6px;
    padding: 6px 12px;
    width: 200px;
    font-size: 12px;
    text-align: left;
    transition: all 0.3s;
}

footer .text-end .footer-form input:focus {
    outline: none;
    border-color: #FBAF99;
}

footer .text-end .footer-form button {
    background: #FBAF99;
    border: 2px solid #FFFFFF;
    border-radius: 6px;
    padding: 6px 15px;
    color: #1E1E1E;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
    white-space: nowrap;
}

footer .text-end .footer-form button:hover {
    background: #F99D84;
    transform: translateY(-2px);
}

.footer-divider {
    border-top: 1px solid #FFF3CC;
    margin: 10px 0;
    opacity: 0.6;
}

.copyright {
    text-align: center;
    color: #FFF3CC;
    opacity: 0.8;
    font-size: 12px;
    margin-top: 5px;
}

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
        align-items: center;
      }

      .rating-section {
        width: 100%;
      }

      .btn-container {
        justify-content: center;
      }

      .footer-top {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px 20px;
      }

      .footer-right {
        width: 100%;
        justify-content: flex-start;
      }

      .footer-right input {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="navbar.css">
</head>
<body>

      <header id="navMount"></header>
  <!-- MAIN CONTENT -->
  <main>
    <div class="page-title">Product Rating</div>

    <div class="product-box">
      <img src="da886f5040f345e1b204dd70d685a408.jpg" alt="Soft green cardigan">
      <div class="product-name">Soft green cardigan</div>
      <div class="product-price">Rp. 250.000,00</div>
    </div>

    <div class="rating-section">
      <div class="rating-label">Product Quality</div>
      <div class="stars" id="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>

      <div class="rating-label">Comment</div>
      <textarea id="comment" placeholder="Tulis pendapatmu di sini..."></textarea>

      <div class="checkbox">
        <input type="checkbox" id="hideUsername">
        <label for="hideUsername">Hide My Username</label>
      </div>

      <div class="btn-container">
        <button class="btn-submit" onclick="submitRating()">Kirim</button>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="logo">
                        <img src="1WhatsApp_Image_2025-11-10_at_15.40.36_a17eedea-removebg-preview.png" alt="Logo MINARI" style="height: 40px; width: auto;">
                    </div>
                    <p>Your everyday fashion boutique</p>
                </div>
                <div class="col-md-6 text-end input-end">
                    <p>Give us suggestions for future progress</p>
                    <div class="footer-form">
                        <input type="text" placeholder="your message . . .">
                        <button>Send</button>
                    </div>
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="copyright">
                © 2025 MINARI. All Rights Reserved.
            </div>
        </div>
  </footer>

  <script>
    const stars = document.querySelectorAll('.star');
    let rating = 0;

    stars.forEach(star => {
      star.addEventListener('click', () => {
        rating = star.getAttribute('data-value');
        updateStars(rating);
      });
    });

    function updateStars(value) {
      stars.forEach(star => {
        if (star.getAttribute('data-value') <= value) {
          star.style.color = '#e5a391';
        } else {
          star.style.color = '#ddd';
        }
      });
    }

    function submitRating() {
      const comment = document.getElementById('comment').value;
      const hideUsername = document.getElementById('hideUsername').checked;

      if (rating === 0) {
        alert('Silakan pilih rating bintang terlebih dahulu.');
        return;
      }

      if (comment.trim() === '') {
        alert('Tolong isi kolom komentar.');
        return;
      }

      alert(`Terima kasih! Rating: ${rating} ★\nKomentar: ${comment}\nHide Username: ${hideUsername ? 'Ya' : 'Tidak'}`);
      window.location.href = 'landing.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
