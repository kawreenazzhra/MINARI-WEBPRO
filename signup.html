<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINARI | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
      <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <header id="navMount"></header>
  <!-- Login Section -->
  <section class="login-section d-flex align-items-center justify-content-center">
    <div class="login-box p-4 shadow-lg rounded-4">
      <h3 class="text-center fw-bold mb-4">SignUp Account</h3>
  <form id="signupForm" novalidate>
  <div class="mb-3">
    <label for="fullName" class="form-label">Name</label>
    <input type="text" class="form-control" id="fullName" placeholder="Enter your name" required>
  </div>

  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <input type="text" class="form-control" id="username" placeholder="Enter username" required>
  </div>

  <div class="mb-3">
    <label for="phone" class="form-label">Phone number</label>
    <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
  </div>

  <div class="mb-3">
    <label for="birthdate" class="form-label">Birthday date</label>
    <input type="date" class="form-control" id="birthdate" required>
  </div>

  <div class="mb-3 position-relative">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password" placeholder="Create your password" required>
    <button type="button" class="toggle-pass" aria-label="Show/Hide password">👁️</button>
  </div>

  <div id="formErrors" class="text-danger small mb-2" style="min-height:18px;"></div>

  <button type="submit" class="btn w-100 login-btn">Sign up</button>
</form>

<div class="text-center my-3 text-muted">— Or —</div>

<button class="btn w-100 google-btn" id="SignLogin">
  Sign in with Google
</button>


      <!-- Tambah sedikit space bawah -->
      <div style="height: 30px;"></div>
    </div>
  </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
        <script src="navbar.js"></script>
</body>
</html>
